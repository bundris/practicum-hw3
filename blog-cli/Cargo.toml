[package]
name = "blog-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "blog-cli"
path = "src/main.rs"

[dependencies]
blog-client = { path = "../blog-client" }
clap = { version = "4", features = ["derive"] }
tokio = { workspace = true }
dotenvy = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
anyhow = { workspace = true }
